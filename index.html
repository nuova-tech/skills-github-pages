<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="AI Fitness Coach — real-time computer-vision workout tracking, form coaching, and gamification powered by MediaPipe Pose and TensorFlow.js. Runs entirely on-device." />
  <title>AI Fitness Coach</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="./assets/css/styles.css" />

  <!-- Computer-vision stack (client-side, CDN). MediaPipe Pose for landmarks,
       TensorFlow.js available for the classification path. -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4/dist/tf.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="appShell">
    <main id="app" class="app-main"><!-- views render here --></main>
    <div id="nav"><!-- bottom nav renders here --></div>
  </div>

  <noscript>
    <p style="padding:2rem;color:#e2e8f0;background:#0b1020;">
      AI Fitness Coach needs JavaScript and camera access to track your workouts.
    </p>
  </noscript>

  <script type="module" src="./assets/js/app.js"></script>
  <script>
    // Register the service worker for offline/PWA support (best-effort).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('SW registration failed', e));
      });
    }
  </script>
</body>
</html>
